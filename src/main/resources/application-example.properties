# Modelo de configuracao do StockHub.
# Copie para application-local.properties (ignorado pelo Git) ou defina as variaveis de ambiente.
# NUNCA coloque credenciais reais neste arquivo.

spring.application.name=StockHub-Spring

# Conexao com o PostgreSQL (banco "stockhub" deve existir)
spring.datasource.url=jdbc:postgresql://localhost:5432/stockhub
# Usuario e senha vem de variaveis de ambiente
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Carrega configuracoes locais opcionais (nao versionadas)
spring.config.import=optional:classpath:application-local.properties

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Views JSP
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

# Porta do servidor
server.port=8080