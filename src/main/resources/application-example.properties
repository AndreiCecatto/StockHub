# Modelo de configuração do StockHub.
# Copie para application-local.properties (ignorado pelo Git) ou defina as variáveis de ambiente.
# NUNCA coloque credenciais reais neste arquivo.

spring.application.name=StockHub-Spring

# Conexão com o PostgreSQL (o banco "stockhub" deve existir)
spring.datasource.url=jdbc:postgresql://localhost:5432/stockhub
# Usuário e senha vêm de variáveis de ambiente
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Carrega configurações locais opcionais (não versionadas)
spring.config.import=optional:classpath:application-local.properties

# Migrations versionadas (src/main/resources/db/migration); o Hibernate apenas valida o schema
spring.flyway.enabled=true

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
# Sem open-in-view: a sessão do Hibernate fecha ao fim do service (as consultas já trazem o que a tela usa)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Views JSP
spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp

# Porta do servidor
server.port=8080

# Cookie de sessão: inacessível ao JavaScript e não enviado em requisições de outros sites.
# Em produção (HTTPS) defina COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Páginas de erro nunca mostram stack trace nem detalhes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
