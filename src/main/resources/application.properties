spring.application.name=StockHub-Spring

spring.datasource.url=jdbc:postgresql://localhost:5432/stockhub
spring.config.import=optional:classpath:application-local.properties


spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
# Sem open-in-view: a sessão do Hibernate fecha ao fim do service (as consultas já trazem o que a tela usa)
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.view.prefix=/WEB-INF/pages/
spring.mvc.view.suffix=.jsp
server.port=8080

# Cookie de sessão: inacessível ao JavaScript e não enviado em requisições de outros sites.
# Em produção (HTTPS) defina COOKIE_SECURE=true.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# Páginas de erro nunca mostram stack trace nem detalhes internos
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Upload de NF-e (XML): no máximo 2 MB por arquivo (o service confere de novo em bytes antes de ler o conteúdo)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2560KB
